spring:
  profiles:
    active: dev
  application:
    name: md-agent
  datasource:
    url: "${DB_URL:jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.db-name}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}"
    username: ${DB_USERNAME:${mysql.username}}
    password: ${DB_PASSWORD:${mysql.password}}
  ai:
    openai:
      base-url: ${AI_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_QWEN_API_KEY:${ai.qwen.api-key}}
      chat:
        options:
          model: ${AI_QWEN_MODEL:${ai.qwen.model[0]}}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

chat:
  persistence:
    flush-interval-ms: 60000   # 聊天刷盘间隔时间

server:
  port: ${SERVER_PORT:8080}
