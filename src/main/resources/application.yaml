spring:
  profiles:
    active: dev
  application:
    name: md-agent
  datasource:
    url: "${DB_URL:jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.db-name}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}"
    username: ${DB_USERNAME:${mysql.username}}
    password: ${DB_PASSWORD:${mysql.password}}
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY}
      chat:
        options:
          model: qwen3.8-flash

mybatis:
  configuration:
    map-underscore-to-camel-case: true

chat:
  persistence:
    flush-interval-ms: 60000   # 聊天刷盘间隔时间

agent:
  audit:
    log-dir: log

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.jacolp.agent.audit: INFO
